<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Group Gallery</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171d2c; --panel2:#1e2637; --line:#2b3549;
    --text:#e7ecf5; --muted:#9aa7be; --accent:#6ea8ff; --accent2:#8ce0c0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #app{display:grid;grid-template-columns:250px 1fr 300px;grid-template-rows:56px 1fr;height:100vh}
  header{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  #list{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
  .item{padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);border-color:var(--accent)}
  .item .nm{font-weight:600}
  .item .sg{color:var(--accent2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  #stage{position:relative;overflow:hidden}
  #canvas{display:block;width:100%;height:100%}
  #views{position:absolute;left:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
  #hint{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:11.5px}
  #info{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
  #info h2{font-size:15px;margin:.2em 0 .1em}
  #info .formula{color:var(--muted);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .row .k{color:var(--muted)} .row .v{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
  .note{margin-top:12px;color:#c7d2e6;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
  #legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
  .mult{color:var(--accent);font-weight:600}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Space Group Gallery</h1>
    <span class="sub">interactive three-view explorer for cubic crystal structures</span>
  </header>
  <aside id="list"></aside>
  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="views">
      <button class="btn" data-v="left">Left (∥x)</button>
      <button class="btn" data-v="front">Front (∥y)</button>
      <button class="btn" data-v="top">Top (∥z)</button>
      <button class="btn active" data-v="3d">3D · drag</button>
    </div>
    <div id="hint">Drag to rotate in 3D mode. Orthographic views are axis-true projections.</div>
  </main>
  <aside id="info"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const CPK = {H:'#ffffff',C:'#909090',O:'#ff4d4d',F:'#78d84f',Na:'#ab5cf2',
  Cl:'#31e531',Ca:'#4fe04f',Al:'#c6a6a6',Si:'#f0c8a0',N:'#3050f8'};
const RAD = {O:0.045,C:0.05,F:0.045,N:0.05,Si:0.062,Al:0.062,Na:0.075,Cl:0.078,Ca:0.082,Ca_:0.082};
function colorOf(e){return CPK[e]||'#b0b0b0';}
function radOf(e){return RAD[e]||0.06;}

const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.01,20);
scene.add(new THREE.AmbientLight(0xffffff,0.62));
const d1=new THREE.DirectionalLight(0xffffff,0.85); d1.position.set(3,4,5); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.35); d2.position.set(-4,-2,-3); scene.add(d2);

const sphereGeo=new THREE.SphereGeometry(1,20,20);
const matCache={};
function matOf(e){ if(!matCache[e]) matCache[e]=new THREE.MeshPhongMaterial({color:colorOf(e),shininess:55}); return matCache[e]; }

let model=new THREE.Group(); scene.add(model);
let mode='3d', autorot=true;

function clearModel(){ scene.remove(model); model.traverse(o=>{if(o.geometry&&o.geometry!==sphereGeo)o.geometry.dispose();}); model=new THREE.Group(); scene.add(model); }

function build(struct){
  clearModel();
  const a=struct.a;
  for(const at of struct.atoms){
    const m=new THREE.Mesh(sphereGeo, matOf(at.e));
    const r=radOf(at.e); m.scale.set(r,r,r);
    m.position.set(at.x/a, at.y/a, at.z/a);   // normalise to a unit cell centred at origin
    model.add(m);
  }
  const edges=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
    new THREE.LineBasicMaterial({color:0x5a6b86}));
  model.add(edges);
  setView(mode);
}

function setView(v){
  mode=v;
  document.querySelectorAll('#views .btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  model.rotation.set(0,0,0);
  if(v==='top'){ camera.position.set(0,0,4); camera.up.set(0,1,0); }
  else if(v==='front'){ camera.position.set(0,-4,0); camera.up.set(0,0,1); }
  else if(v==='left'){ camera.position.set(4,0,0); camera.up.set(0,0,1); }
  else { camera.position.set(3.0,2.4,3.4); camera.up.set(0,1,0); }
  camera.lookAt(0,0,0);
  autorot=(v==='3d');
}

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  renderer.setSize(w,h,false);
  const halfH=0.82, halfW=halfH*(w/h);
  camera.left=-halfW; camera.right=halfW; camera.top=halfH; camera.bottom=-halfH;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

// simple drag rotation (only in 3D mode) -------------------------------
let dragging=false,px=0,py=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;autorot=false;px=e.clientX;py=e.clientY;});
window.addEventListener('pointerup',()=>{dragging=false; if(mode==='3d') autorot=true;});
window.addEventListener('pointermove',e=>{
  if(!dragging||mode!=='3d')return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  model.rotation.y+=dx*0.01; model.rotation.x+=dy*0.01;
});

function loop(){
  requestAnimationFrame(loop);
  if(autorot&&mode==='3d') model.rotation.y+=0.0038;
  renderer.render(scene,camera);
}

// UI -------------------------------------------------------------------
function renderInfo(s){
  const info=document.getElementById('info');
  const els=[...new Set(s.atoms.map(a=>a.e))];
  info.innerHTML=`
    <h2>${s.name}</h2>
    <div class="formula">Space group <b style="font-family:ui-monospace">${s.symbol}</b> · No. ${s.number}</div>
    <div class="row"><span class="k">Crystal system</span><span class="v">Cubic</span></div>
    <div class="row"><span class="k">Lattice</span><span class="v">${s.lattice}</span></div>
    <div class="row"><span class="k">Point group</span><span class="v">${s.point}</span></div>
    <div class="row"><span class="k">General multiplicity</span><span class="v mult">${s.mult}</span></div>
    <div class="row"><span class="k">Atoms in cell</span><span class="v">${s.natoms}</span></div>
    <div class="row"><span class="k">Cell edge a</span><span class="v">${s.a} &#8491;</span></div>
    <div class="note">${s.note}</div>
    <div id="legend">${els.map(e=>`<span class="chip"><span class="dot" style="background:${colorOf(e)}"></span>${e}</span>`).join('')}</div>`;
}

const list=document.getElementById('list');
STRUCTURES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='item'+(i===0?' active':'');
  el.innerHTML=`<div class="nm">${s.name}</div><div class="sg">${s.symbol} · No.${s.number} · <span style="color:var(--muted)">mult ${s.mult}</span></div>`;
  el.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));el.classList.add('active');select(s);};
  list.appendChild(el);
});
document.querySelectorAll('#views .btn').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function select(s){ build(s); renderInfo(s); }

resize(); build(STRUCTURES[0]); renderInfo(STRUCTURES[0]); loop();
</script>
